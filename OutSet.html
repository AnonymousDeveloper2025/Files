let answers = {};
let questionCounter = 1;

function renderQuestions() {
  const container = document.getElementById('questions-container');
  // Carregar do localStorage
  const saved = localStorage.getItem('outsetAnswers');
  if(saved) answers = JSON.parse(saved);

  blocks.forEach(block => {
    container.innerHTML += `<div class="block-title"><i data-lucide="${block.icon}"></i> ${block.title}</div><img src="${block.img}" class="block-img" alt="${block.title}">`;
    block.questions.forEach(item => {
      const num = questionCounter++;
      const savedValue = answers[num] || '';
      container.innerHTML += `
        <div class="question ${savedValue? 'added' : ''}" id="q-${num}">
          <label><i data-lucide="circle"></i> <span class="cat">${item.cat}</span> P${num}: ${item.q}</label>
          <textarea id="input-${num}" placeholder="Escreve a tua resposta...">${savedValue}</textarea>
          <button class="btn" onclick="addAnswer(${num})"><i data-lucide="check"></i> OK</button>
        </div>
      `;
    });
  });
  lucide.createIcons();
  updatePrompt();
  updateProgress();
}

function addAnswer(num) {
  const input = document.getElementById(`input-${num}`).value.trim();
  if(!input) { alert("Escreve uma resposta primeiro :)"); return; }
  answers[num] = input;
  localStorage.setItem('outsetAnswers', JSON.stringify(answers)); // GUARDA
  document.getElementById(`q-${num}`).classList.add('added');
  updatePrompt();
  updateProgress();
  const next = document.getElementById(`q-${num+1}`);
  if(next) next.scrollIntoView({behavior: 'smooth', block: 'center'});
}

function updatePrompt() {
  let text = "";
  for(let i = 1; i < questionCounter; i++) {
    if(answers[i]) text += `P${i}: ${answers[i]}\n\n`;
  }
  document.getElementById('prompt-final').value = text;
}

function updateProgress() {
  document.getElementById('progress').innerText = `${Object.keys(answers).length} de ${questionCounter-1} respondidas`;
}

function copyPrompt() {
  const prompt = document.getElementById('prompt-final');
  prompt.select();
  navigator.clipboard.writeText(prompt.value);
  alert("✅ Prompt copiado!");
}

function clearPrompt() {
  if(confirm("Apagar todas as respostas?")) {
    answers = {};
    localStorage.removeItem('outsetAnswers');
    document.querySelectorAll('textarea').forEach(t => t.value = '');
    document.querySelectorAll('.question').forEach(q => q.classList.remove('added'));
    updatePrompt(); updateProgress();
  }
}

renderQuestions();
</script>
